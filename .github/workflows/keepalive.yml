name: Keepalive Workflow
on:
  schedule:
    # 每30天运行一次（建议小于45天，留出安全余量）
    - cron: '0 0 */30 * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          # 可选配置
          time_elapsed: 45  # 上次提交超过45天时触发（默认）
          commit_message: "chore: keep workflow alive"
          use_api: true     # 使用API方式（不产生提交记录）
